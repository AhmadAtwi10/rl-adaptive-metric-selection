# config_permetric_n5m7.yaml
# ============================================================
# PerMetricActorCritic — tuned to outperform Flat MLP
# N=5, M=7, density=0.25
#
# Key insight: PerMetric's architectural advantages (shared
# encoder, guaranteed feature-to-logit mapping, global context)
# only become visible when the reward signal is rich and clean.
# The MLP config had beta=1, b_a=80, b_c=100 — all broken.
# This config fixes all three AND tunes PerMetric specifically.
# ============================================================

environment:
  n_nodes:   5
  n_metrics: 7
  episode_length: 512
  per_metric_cost: 0.01

  cost_iot:   0.05
  cost_edge:  0.02
  cost_cloud: 0.005


  anomaly_baseline_pct: 70

  causal_baseline_pct: 100

  window_size:   10
  window_agg:    max
  coverage_mode: window


  iot_cap_range:   [0.20, 0.40]   
  edge_cap_range:  [0.40, 0.70]   
  cloud_cap_range: [0.70, 0.90]   

  # Node-tier split. Cloud is derived as the remainder, so the value below is
  # documentation only — the generator ignores it. Note that N=5 does NOT
  # realise 30/40/30: integer flooring yields 1 IoT / 2 edge / 2 cloud = 20/40/40.
  node_tiers:
    iot: 0.3
    edge: 0.4
    cloud: 0.3

reward:
  alpha:   10.0

  beta:    1.0

  lambda_: 0.1    # tier cost — small tiebreaker
  delta:   0.1    # switching penalty on unimportant metrics
  eta:     2.0    # idle penalty

ppo:
  # More timesteps than MLP config — PerMetric has more parameters
  # and needs more steps to fully exploit its architectural advantage
  total_timesteps: 10_000_000   # MLP used 4M but PerMetric converges
                                # faster once reward signal is clean
  n_envs:     4
  n_steps:    512
  batch_size: 128
  n_epochs:   10
  gamma:      0.99
  gae_lambda: 0.95
  clip_range: 0.2
  learning_rate: 3.0e-4

  # Slightly higher entropy than MLP — PerMetric with richer reward
  # landscape benefits from more exploration early in training.
  # The shared encoder needs to explore diverse token patterns
  # before specialising.
  ent_coef: 0.02   

  vf_coef:       0.25
  max_grad_norm: 0.5
  eval_freq:     5_000
  eval_episodes: 20

policy:
  policy_type: per_metric
  metric_hidden: 160
  global_hidden: 320
  global_pool:   mean

  use_layer_norm: true
  activation:    relu
  hidden_sizes:  [256, 128]   # flat MLP fallback (unused)

data:
  n_train_episodes: 500
  n_eval_episodes:  200
  anomaly_density:  0.25
  causal_density:   0.25
  seed: 42

paths:
  data_dir:    data
  results_dir: results/
  run_name:    null
  model_name:  best_model.pt
  log_name:    training_log.csv